[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcsum-agentic"
version = "0.1.0"
description = "Agentic zh-TW meeting summarizer (ARC+POINTS external memory) for a 1B on-device student"
requires-python = ">=3.12"

# ZERO CORE DEPENDENCIES — load-bearing, not incidental.
# The harness (transcript, chunker, memory, ops, guards, prompts, agent, baseline,
# char-level metrics, the judge HTTP client) is stdlib-only, so it is importable and
# fully testable with no GPU, no weights, and no network. Anything heavier goes in an
# extra below. Do not add to this list.
dependencies = []

[project.optional-dependencies]
# Real MiniCPM5 token counting — normative for every reported budget number (SPEC §7).
tokenizer = ["transformers>=5.5"]

# SPEC §5 reference metrics. Char-level ROUGE / coverage / density are implemented
# in-repo (arcsum/metrics/reference.py) rather than taken from `rouge-score`, whose
# tokenizer is Latin-hardcoded and would contradict §5's normative char-level
# tokenization. Kept light so it can run in CI.
metrics = ["sacrebleu>=2.4"]

# SPEC-adjacent: Simplified-internal operation (arcsum/simplified.py). Optional because the
# suite must run with no extra installed; `converter()` degrades to identity without it.
script = ["opencc-python-reimplemented>=0.1.7"]
metrics-neural = ["bert-score>=0.3.13", "torch>=2.6", "transformers>=5.5"]
# Isolated on purpose: moverscore is effectively unmaintained and pins old pyemd/BERT.
metrics-mover = ["moverscore>=1.0.3", "pyemd>=1.0.0"]

# SPEC §4.2 teacher supervision: measured, not assumed, on the real Qwen3.8-27B
# teacher -- it drifts into simplified characters under retry pressure even when
# explicitly instructed to write zh-TW only (Phase 1 pilot, 2026-08-22). `s2twp`
# (Taiwan MOE standard, phrase-aware) is used deliberately over the plainer `s2t`,
# which converts some already-correct modern Taiwan usage into obscure classical
# variants (e.g. 核准 -> 覈准) that read as wrong to a native reader.
supervision = ["opencc>=1.1"]

# Phase 3's held-out zh-TW audio slice (eval only, never training).
asr = ["torch>=2.6", "transformers>=5.5", "librosa", "soundfile", "accelerate", "opencc>=1.1"]

# Offline teacher / fine-tune. Never installed on the reference device (SPEC §6).
train = [
  "unsloth",
  "trl>=0.24",
  "datasets>=4.3",
  "peft>=0.20",
  "accelerate",
  "transformers>=5.5",
  "bitsandbytes",  # required by optim="adamw_8bit"
]

# Optional in-process student, as an alternative to HTTP to llama-server.
serve = ["llama-cpp-python>=0.3.35"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arcsum-bench        = "arcsum.cli.device_bench:main"
arcsum-import       = "arcsum.cli.import_corpus:main"
arcsum-gen-traces   = "arcsum.cli.gen_traces:main"
arcsum-build-sft    = "arcsum.cli.build_sft:main"
arcsum-run-arms     = "arcsum.cli.run_arms:main"
arcsum-probe        = "arcsum.cli.probe:main"
arcsum-judge        = "arcsum.cli.judge:main"
arcsum-score        = "arcsum.cli.score:main"
arcsum-report       = "arcsum.cli.report:main"
arcsum-eval         = "arcsum.cli.eval_all:main"
arcsum-train-sft    = "arcsum.cli.train_sft:main"
arcsum-trace-report = "arcsum.cli.trace_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "metrics: needs the [metrics]/[metrics-neural] extra",
  "tokenizer: needs the [tokenizer] extra and a local MiniCPM5 tokenizer",
  "device: runs only on the reference hardware (SPEC §6)",
  "slow: excluded from the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `runs/` holds FROZEN measurement artifacts -- the scripts committed there are the record
# of how a number was produced and must stay byte-identical to what was actually run.
# Reformatting them to satisfy the linter would silently invalidate that provenance.
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Ambiguous / fullwidth / CJK characters are the SUBJECT MATTER in these modules and
# their tests — flagging them as confusables is noise that would train us to ignore the
# rule everywhere. Kept narrow: only the files whose job is to reason about scripts.
"src/arcsum/lang.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/tokens.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/memory.py" = ["RUF001", "RUF002", "RUF003"]
# The churn guard's docstring quotes verbatim the zh-TW ops that motivated it.
"src/arcsum/guards.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/ops.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/prose.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tokens.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_memory.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_render.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ops.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_prose.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_prompts.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_guards.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_agent.py" = ["RUF001", "RUF002", "RUF003"]
# The reward is ranked on zh-TW ops; the near-duplicate and grounding cases ARE the text.
"tests/test_step_reward.py" = ["RUF001", "RUF002", "RUF003"]
# Same rule, same reason: this parser's job is the zh-TW gazette's fullwidth delimiters,
# so the confusable characters in its regexes and docs ARE the specification.
"tools/ly_odt_to_v2.py" = ["RUF001", "RUF002", "RUF003"]
# The Gradio demo renders zh-TW UI copy; an en dash in a numeric range is correct
# typography, not an identifier hazard.
"demo/space_gradio/app.py" = ["RUF001", "RUF002", "RUF003"]
# These tools quote zh-TW/zh-CN text and the ASR model's own prompt verbatim; the
# confusable characters are the data being documented.
"tools/asr_transcribe.py" = ["RUF001", "RUF002", "RUF003"]
# Carries SPEC 2.2 stage 3's zh-TW composition prompt verbatim; its fullwidth punctuation
# is part of the prompt text and must not drift from the pilot's.
"tools/build_heldout_refs.py" = ["RUF001", "RUF002", "RUF003"]
# Plants zh-TW scenario text and generation prompts verbatim; the fullwidth punctuation
# is the data being generated, not an identifier hazard.
"tools/gen_reversals.py" = ["RUF001", "RUF002", "RUF003"]
"tools/gen_deliberation.py" = ["RUF001", "RUF002", "RUF003"]
"tools/gen_hedge_synth.py" = ["RUF001", "RUF002", "RUF003"]
"tools/gen_detail_synth.py" = ["RUF001", "RUF002", "RUF003"]
"tools/gen_selfdistil_synth.py" = ["RUF001", "RUF002", "RUF003"]
# Carries zh-TW tool descriptions and instructions verbatim.
"tools/to_toolcalls.py" = ["RUF001", "RUF002", "RUF003"]
# Emits the zh-TW reviewer instructions and questionnaire verbatim.
"tools/build_review_packet.py" = ["RUF001", "RUF002", "RUF003"]
"tools/latin_ablation.py" = ["RUF001", "RUF002", "RUF003"]
"tools/v1_to_v2.py" = ["RUF001", "RUF002", "RUF003"]
"tests/conftest.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_lang.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_transcript.py" = ["RUF001", "RUF002", "RUF003"]
# Model-facing zh-TW prompt text is byte-stable by contract; do not reflow it.
"src/arcsum/prompts.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"src/arcsum/agent.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/backends/llama_server.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/probe.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_probe.py" = ["RUF001", "RUF002", "RUF003"]
# Hand-written zh-TW probe transcripts: fullwidth punctuation is correct Traditional
# Chinese, and reflowing an utterance would change the transcript under test (§2's
# "one utterance = one line" is a hard rule, so these lines cannot be wrapped).
"src/arcsum/probe_data.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"src/arcsum/judge/faith.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_judge.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_corpus.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_supervision.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_judge_selftest.py" = ["RUF001", "RUF002", "RUF003"]
