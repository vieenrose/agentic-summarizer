"tests/test_cli_probe.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_cli_judge.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_cli_gen_traces.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_cli_run_arms.py" = ["RUF001", "RUF002", "RUF003"]
