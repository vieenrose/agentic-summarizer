"src/arcsum/evalkit/behaviour.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/evalkit/grounding.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/rl/reward.py" = ["RUF001", "RUF002", "RUF003"]
"src/arcsum/rl/step_reward.py" = ["RUF001", "RUF002", "RUF003"]
"tools/raft_reading.py" = ["RUF001", "RUF002", "RUF003"]
